<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Spin Masters - Shiba</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@700;900&display=swap');

        * { box-sizing: border-box; user-select: none; margin: 0; padding: 0; }

        body {
            height: 100vh;
            font-family: 'Cairo', sans-serif;
            background-image: url('bg.png');
            background-size: cover;
            background-position: center;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            position: relative;
        }

        /* الشريط العلوي (مستوى، عملات) */
        .top-bar {
            width: 100%;
            padding: 10px 15px;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            z-index: 10;
        }

        .player-info {
            display: flex;
            align-items: center;
            gap: 10px;
            background: rgba(0, 0, 0, 0.6);
            padding: 5px 15px 5px 5px;
            border-radius: 30px;
            border: 2px solid #FFD700;
        }

        .avatar {
            width: 40px; height: 40px;
            background: #8e44ad;
            border-radius: 50%;
            border: 2px solid #fff;
            display: flex; justify-content: center; align-items: center;
            font-size: 20px;
        }

        .level-bar {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }
        
        .level-text { color: white; font-size: 12px; font-weight: bold; }
        .progress-bg {
            width: 80px; height: 8px;
            background: #333; border-radius: 5px;
            overflow: hidden;
        }
        .progress-fill {
            width: 60%; height: 100%;
            background: #2ed573;
        }

        .currency {
            display: flex;
            align-items: center;
            gap: 5px;
            background: rgba(0, 0, 0, 0.6);
            padding: 5px 15px;
            border-radius: 30px;
            border: 2px solid #FFD700;
            color: #FFD700;
            font-weight: 900;
            font-size: 18px;
        }

        .currency img { width: 25px; height: 25px; }

        /* منطقة الماكينة */
        .game-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        .machine-frame {
            background: linear-gradient(180deg, #4a4a4a, #1a1a1a);
            padding: 15px;
            border-radius: 20px;
            border: 4px solid #FFD700;
            box-shadow: 0 15px 30px rgba(0,0,0,0.8), inset 0 0 20px rgba(255, 215, 0, 0.4);
            position: relative;
            display: flex;
            gap: 5px;
        }

        /* الشاشة الزجاجية للماكينة */
        .reels-container {
            background: #fff;
            border-radius: 10px;
            padding: 5px;
            display: flex;
            gap: 5px;
            box-shadow: inset 0 0 20px rgba(0,0,0,0.8);
            overflow: hidden;
            position: relative;
        }

        .reel {
            width: 80px; height: 240px;
            background: #f1f2f6;
            overflow: hidden;
            position: relative;
            border-radius: 5px;
        }

        .reel-strip {
            display: flex;
            flex-direction: column;
            transition: transform 3s cubic-bezier(0.1, 0.7, 0.1, 1);
        }

        .reel-strip img {
            width: 80px; height: 80px;
            object-fit: contain;
            padding: 10px;
            background: #fff;
            border-bottom: 1px solid #ddd;
        }

        .win-line {
            position: absolute;
            top: 50%;
            left: 0; width: 100%;
            height: 4px;
            background: rgba(255, 0, 0, 0.5);
            box-shadow: 0 0 10px red;
            transform: translateY(-50%);
            z-index: 5;
            pointer-events: none;
        }

        /* زر اللعب واللفات */
        .bottom-controls {
            position: absolute;
            bottom: 80px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            width: 100%;
        }

        .spins-counter {
            background: rgba(0, 0, 0, 0.8);
            color: white;
            padding: 5px 20px;
            border-radius: 20px;
            border: 2px solid #fff;
            font-weight: bold;
            font-size: 18px;
            display: flex;
            align-items: center;
            gap: 5px;
        }
        
        .spins-counter span { color: #2ed573; font-size: 22px; }

        .spin-btn {
            background: linear-gradient(180deg, #2ed573, #1e90ff);
            color: white;
            border: 3px solid #fff;
            padding: 10px 60px;
            font-size: 28px;
            font-family: 'Cairo', sans-serif;
            font-weight: 900;
            border-radius: 40px;
            cursor: pointer;
            box-shadow: 0 8px 0 #2f3542, 0 15px 20px rgba(0,0,0,0.6);
            transition: all 0.1s;
            text-transform: uppercase;
        }

        .spin-btn:active:not(:disabled) {
            transform: translateY(8px);
            box-shadow: 0 0 0 #2f3542, 0 5px 10px rgba(0,0,0,0.6);
        }

        .spin-btn:disabled {
            background: #747d8c;
            box-shadow: 0 8px 0 #2f3542;
        }

        /* القائمة السفلية */
        .bottom-nav {
            height: 70px;
            background: rgba(0, 0, 0, 0.9);
            border-top: 2px solid #FFD700;
            display: flex;
            justify-content: space-around;
            align-items: center;
            width: 100%;
            position: absolute;
            bottom: 0;
        }

        .nav-item {
            color: #aaa;
            font-size: 12px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 5px;
            font-weight: bold;
        }
        .nav-item.active { color: #FFD700; }
        .nav-item .icon { font-size: 24px; }

        /* نافذة الفوز */
        .win-modal {
            position: fixed;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%) scale(0);
            background: radial-gradient(circle, #2b2b2b, #000);
            padding: 30px;
            border-radius: 20px;
            border: 3px solid #FFD700;
            text-align: center;
            color: white;
            z-index: 100;
            transition: transform 0.3s;
            box-shadow: 0 0 50px #FFD700;
            width: 80%;
        }

        .win-modal.show { transform: translate(-50%, -50%) scale(1); }
        .win-modal h2 { margin-bottom: 10px; color: #FFD700; text-shadow: 0 0 10px #FFD700; }
        .win-modal img { width: 80px; height: 80px; margin: 10px; animation: bounce 1s infinite alternate;}
        .win-modal p { font-size: 22px; font-weight: bold; }

        @keyframes bounce {
            from { transform: translateY(0); }
            to { transform: translateY(-10px); }
        }

        /* زر إعادة تعبئة اللفات (للتجربة فقط) */
        .reload-btn {
            margin-top: 10px;
            background: transparent;
            color: #aaa;
            border: 1px solid #aaa;
            padding: 5px 15px;
            border-radius: 10px;
            font-size: 12px;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <!-- الشريط العلوي -->
    <div class="top-bar">
        <div class="player-info">
            <div class="avatar">🐕</div>
            <div class="level-bar">
                <div class="level-text">المستوى 1</div>
                <div class="progress-bg"><div class="progress-fill"></div></div>
            </div>
        </div>
        <div class="currency">
            <img src="coin.png" alt="coin">
            <span id="ui-coins">0</span>
        </div>
    </div>

    <!-- منطقة اللعب -->
    <div class="game-area">
        <div class="machine-frame">
            <div class="reels-container">
                <div class="reel"><div class="reel-strip" id="reel1"></div></div>
                <div class="reel"><div class="reel-strip" id="reel2"></div></div>
                <div class="reel"><div class="reel-strip" id="reel3"></div></div>
                <div class="win-line"></div>
            </div>
        </div>

        <div class="bottom-controls">
            <div class="spins-counter">اللفات: <span id="ui-spins">10</span></div>
            <button class="spin-btn" id="spinBtn">SPIN</button>
            <button class="reload-btn" onclick="location.reload()">(للتجربة) إعادة تعبئة اللفات</button>
        </div>
    </div>

    <!-- القائمة السفلية -->
    <div class="bottom-nav">
        <div class="nav-item"><span class="icon">🏠</span> القرية</div>
        <div class="nav-item active"><span class="icon">🎰</span> الماكينة</div>
        <div class="nav-item"><span class="icon">🃏</span> البطاقات</div>
    </div>

    <!-- نافذة الفوز -->
    <div class="win-modal" id="winModal">
        <h2 id="winTitle">مبروك!</h2>
        <img id="winImg" src="coin.png" alt="Reward">
        <p>ربحت <span id="winAmount">0</span></p>
    </div>

    <script>
        // --- إعدادات اللعبة ---
        const symbols = ['coin.png', 'diamond.png', 'shield.png'];
        let state = {
            coins: 500,
            spins: 10,
            isSpinning: false
        };

        // عناصر الواجهة
        const uiCoins = document.getElementById('ui-coins');
        const uiSpins = document.getElementById('ui-spins');
        const spinBtn = document.getElementById('spinBtn');
        const winModal = document.getElementById('winModal');

        // تحديث الواجهة
        function updateUI() {
            uiCoins.innerText = state.coins;
            uiSpins.innerText = state.spins;
            spinBtn.disabled = state.spins <= 0 || state.isSpinning;
        }

        // ملء البكرات بالصور
        function populateReels() {
            for (let i = 1; i <= 3; i++) {
                const reel = document.getElementById(`reel${i}`);
                let html = '';
                // نضع 20 صورة عشوائية في كل بكرة
                for (let j = 0; j < 20; j++) {
                    const randSym = symbols[Math.floor(Math.random() * symbols.length)];
                    html += `<img src="${randSym}">`;
                }
                reel.innerHTML = html;
            }
        }

        // دالة اللف
        function spin() {
            if (state.isSpinning || state.spins <= 0) return;

            state.isSpinning = true;
            state.spins--;
            updateUI();
            winModal.classList.remove('show');
            populateReels();

            const imageHeight = 80; // ارتفاع الصورة في CSS

            // دالة تحريك بكرة معينة
            function animateReel(id, duration, targetIndex) {
                const reel = document.getElementById(id);
                reel.style.transition = 'none';
                reel.style.transform = 'translateY(0px)';
                void reel.offsetWidth; // Trigger reflow

                // المسافة: 15 صورة للأسفل + موقع الصورة النهائية
                const moveDistance = (imageHeight * 15) + (targetIndex * imageHeight);
                reel.style.transition = `transform ${duration}s cubic-bezier(0.1, 0.7, 0.1, 1)`;
                reel.style.transform = `translateY(-${moveDistance}px)`;
            }

            // تحديد النتائج (عشوائية)
            const res1 = Math.floor(Math.random() * 3);
            const res2 = Math.floor(Math.random() * 3);
            const res3 = Math.floor(Math.random() * 3);

            // تحريك البكرات بأوقات مختلفة
            animateReel('reel1', 2.5, res1);
            animateReel('reel2', 3.0, res2);
            animateReel('reel3', 3.5, res3);

            // بعد انتهاء الحركة
            setTimeout(() => {
                state.isSpinning = false;
                updateUI();
                checkWin(res1, res2, res3);
            }, 3800);
        }

        // حساب الجوائز
        function checkWin(r1, r2, r3) {
            let wonType = '';
            let amount = 0;
            let img = '';

            // إذا تطابقت الثلاثة (Jackpot)
            if (r1 === r2 && r2 === r3) {
                if (r1 === 0) { // Coin
                    amount = 150;
                    state.coins += amount;
                    img = 'coin.png';
                    wonType = 'عملات';
                } else if (r1 === 1) { // Diamond
                    amount = 50;
                    state.coins += amount; // نحوّل الجوهرة لعملات للتبسيط
                    img = 'diamond.png';
                    wonType = 'جواهر (تحولت لعملات)';
                } else { // Shield
                    amount = 30;
                    state.coins += amount;
                    img = 'shield.png';
                    wonType = 'دروع (تحولت لعملات)';
                }
                showModal(amount, img, "JACKPOT! 🎉");
            } 
            // إذا تطابق اثنان (فوز صغير)
            else if (r1 === r2 || r2 === r3 || r1 === r3) {
                amount = 20;
                state.coins += amount;
                img = 'coin.png';
                showModal(amount, img, "فوز صغير!");
            } 
            // خسارة
            else {
                amount = 5; // تعويض بسيط
                state.coins += amount;
                img = 'coin.png';
                showModal(amount, img, "حظ أوفر!");
            }
            
            updateUI();
        }

        function showModal(amount, img, title) {
            document.getElementById('winTitle').innerText = title;
            document.getElementById('winAmount').innerText = amount;
            document.getElementById('winImg').src = img;
            winModal.classList.add('show');

            setTimeout(() => {
                winModal.classList.remove('show');
            }, 2500);
        }

        // بدء اللعبة
        populateReels();
        updateUI();
        spinBtn.addEventListener('click', spin);

        // ربط تليجرام
        if (window.Telegram && window.Telegram.WebApp) {
            window.Telegram.WebApp.ready();
            window.Telegram.WebApp.expand();
        }
    </script>
</body>
</html>
