<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spin Masters - سبين ماسترز</title>
    <style>
        /* هنا نضع كود التصميم (CSS) */
        body {
            /* استدعاء صورة الخلفية bg.png */
            background-image: url('bg.png'); 
            background-size: cover; /* لتغطية الشاشة بالكامل */
            background-position: center;
            background-attachment: fixed;
            margin: 0;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-family: Arial, sans-serif;
        }

        .game-board {
            background-color: rgba(0, 0, 0, 0.7); /* خلفية سوداء شفافة للوحة اللعبة */
            padding: 20px;
            border-radius: 15px;
            text-align: center;
            border: 2px solid #ffd700; /* إطار ذهبي */
        }

        h1 {
            color: white;
            text-shadow: 2px 2px 4px #000;
            margin-bottom: 20px;
        }

        .icons-container {
            display: flex;
            gap: 15px;
            justify-content: center;
            margin-bottom: 20px;
        }

        /* تنسيق الصور/الأيقونات */
        .game-icon {
            width: 80px;  /* عرض الصورة */
            height: 80px; /* طول الصورة */
            object-fit: contain;
            transition: transform 0.3s;
        }

        .game-icon:hover {
            transform: scale(1.1); /* تكبير الصورة قليلاً عند تمرير الماوس */
        }

        button {
            background-color: #4CAF50;
            color: white;
            border: none;
            padding: 15px 30px;
            font-size: 20px;
            font-weight: bold;
            border-radius: 10px;
            cursor: pointer;
            box-shadow: 0 4px #2E7D32;
        }

        button:active {
            box-shadow: 0 2px #2E7D32;
            transform: translateY(2px);
        }
    </style>
</head>
<body>

    <div class="game-board">
        <h1>لعبة Spin Masters</h1>
        
        <!-- هنا نستدعي الصور التي قمنا برفعها -->
        <div class="icons-container">
            <img src="coin.png" alt="عملة" class="game-icon">
            <img src="diamond.png" alt="ماسة" class="game-icon">
            <img src="shield.png" alt="درع" class="game-icon">
        </div>

        <button>ابدأ اللعب</button>
    </div>

</body>
</html>
