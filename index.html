<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Coins Master - Shiba 3D</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@700;900&display=swap');

        * { box-sizing: border-box; user-select: none; margin: 0; padding: 0; }

        body {
            height: 100vh;
            font-family: 'Cairo', sans-serif;
            background-image: url('bg.png');
            background-size: cover;
            background-position: center;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            position: relative;
        }

        /* تأثير اهتزاز الشاشة */
        @keyframes shake {
            0% { transform: translate(1px, 1px) rotate(0deg); }
            10% { transform: translate(-1px, -2px) rotate(-1deg); }
            20% { transform: translate(-3px, 0px) rotate(1deg); }
            30% { transform: translate(3px, 2px) rotate(0deg); }
            40% { transform: translate(1px, -1px) rotate(1deg); }
            50% { transform: translate(-1px, 2px) rotate(-1deg); }
            60% { transform: translate(-3px, 1px) rotate(0deg); }
            70% { transform: translate(3px, 1px) rotate(-1deg); }
            80% { transform: translate(-1px, -1px) rotate(1deg); }
            90% { transform: translate(1px, 2px) rotate(0deg); }
            100% { transform: translate(1px, -2px) rotate(-1deg); }
        }
        .shake { animation: shake 0.5s; animation-iteration-count: 1; }

        #coin-canvas {
            position: absolute; top: 0; left: 0;
            width: 100%; height: 100%;
            pointer-events: none; z-index: 999;
        }

        /* الشريط العلوي الفاخر */
        .top-bar {
            width: 100%; padding: 15px;
            display: flex; justify-content: space-between;
            z-index: 10;
        }

        .ui-box {
            background: linear-gradient(180deg, #2b2b2b, #000);
            border: 3px solid #d4af37; /* لون ذهبي معدني */
            border-radius: 25px;
            padding: 5px 15px;
            display: flex; align-items: center; gap: 10px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.8), inset 0 2px 5px rgba(255,215,0,0.5);
        }

        .ui-box img { width: 35px; height: 35px; filter: drop-shadow(0 2px 3px #000); }
        .ui-text { color: #FFD700; font-weight: 900; font-size: 22px; text-shadow: 0 2px 2px #000; }

        /* منطقة اللعب */
        .game-area {
            flex: 1; display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            position: relative; z-index: 5; margin-top: -20px;
        }

        /* إطار الماكينة المعدني */
        .machine {
            background: linear-gradient(135deg, #e6c27a 0%, #b8860b 50%, #e6c27a 100%);
            padding: 15px;
            border-radius: 20px;
            box-shadow: 
                0 20px 40px rgba(0,0,0,0.9), 
                inset 0 0 15px rgba(255,255,255,0.6),
                inset 0 0 10px rgba(0,0,0,0.5);
            position: relative;
            display: flex; gap: 5px;
            border: 2px solid #fff;
        }

        /* الشاشة الزجاجية الداخلية */
        .reels-display {
            background: #111;
            padding: 8px;
            border-radius: 12px;
            display: flex; gap: 8px;
            box-shadow: inset 0 10px 30px rgba(0,0,0,1), inset 0 -10px 30px rgba(0,0,0,1);
            position: relative;
            border: 3px solid #333;
        }

        /* تأثير انعكاس الزجاج */
        .reels-display::after {
            content: '';
            position: absolute; top: 0; left: 0; right: 0; height: 40%;
            background: linear-gradient(180deg, rgba(255,255,255,0.4) 0%, rgba(255,255,255,0) 100%);
            border-radius: 10px 10px 0 0;
            pointer-events: none;
            z-index: 20;
        }

        .reel {
            width: 80px; height: 240px;
            background: #fff;
            border-radius: 8px;
            overflow: hidden;
            position: relative;
            box-shadow: inset 0 0 15px rgba(0,0,0,0.8);
        }

        .reel-strip {
            display: flex; flex-direction: column;
            transition: transform 3s cubic-bezier(0.1, 0.7, 0.1, 1);
        }

        .reel-strip img {
            width: 80px; height: 80px;
            object-fit: contain; padding: 10px;
            background: #fff; border-bottom: 1px solid #ccc;
        }

        .win-line {
            position: absolute; top: 50%; left: 0; width: 100%; height: 4px;
            background: rgba(255, 0, 0, 0.8);
            box-shadow: 0 0 15px red;
            transform: translateY(-50%); z-index: 10;
        }

        /* الأزرار والعدادات */
        .controls {
            margin-top: 30px;
            display: flex; flex-direction: column; align-items: center; gap: 15px;
        }

        /* عداد اللفات */
        .spins-box {
            background: rgba(0,0,0,0.8);
            border: 2px solid #FFD700;
            border-radius: 20px;
            padding: 5px 25px;
            color: white; font-weight: bold; font-size: 18px;
            box-shadow: 0 5px 10px rgba(0,0,0,0.5);
        }
        .spins-box span { color: #2ed573; font-size: 24px; text-shadow: 0 0 10px #2ed573; }

        /* زر SPIN الفاخر */
        .spin-btn {
            background: linear-gradient(180deg, #2ed573 0%, #1e90ff 100%);
            color: white;
            border: 4px solid #fff;
            padding: 15px 70px;
            font-size: 32px;
            font-family: 'Cairo', sans-serif; font-weight: 900;
            border-radius: 50px; cursor: pointer;
            box-shadow: 0 10px 0 #1a5c3a, 0 15px 25px rgba(0,0,0,0.8);
            transition: all 0.1s;
            text-shadow: 0 2px 5px rgba(0,0,0,0.5);
            position: relative;
            overflow: hidden;
        }

        /* تأثير لمعان الزر */
        .spin-btn::after {
            content: ''; position: absolute; top: 0; left: -100%; width: 50%; height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.4), transparent);
            transform: skewX(-20deg);
            animation: shine 3s infinite;
        }
        @keyframes shine { 100% { left: 200%; } }

        .spin-btn:active:not(:disabled) {
            transform: translateY(10px);
            box-shadow: 0 0 0 #1a5c3a, 0 5px 10px rgba(0,0,0,0.8);
        }

        .spin-btn:disabled { background: #555; box-shadow: 0 10px 0 #222; cursor: not-allowed; color: #888; }

        /* نافذة الفوز */
        .win-modal {
            position: fixed; top: 50%; left: 50%;
            transform: translate(-50%, -50%) scale(0);
            background: radial-gradient(circle, #4a1c1c, #000);
            padding: 40px 20px; border-radius: 30px;
            border: 4px solid #FFD700; text-align: center; color: white; z-index: 1000;
            transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: 0 0 80px #FFD700; width: 85%;
        }

        .win-modal.show { transform: translate(-50%, -50%) scale(1); }
        .win-modal h2 { font-size: 38px; color: #FFD700; margin-bottom: 15px; text-shadow: 0 0 20px #FFD700; }
        .win-modal img { width: 120px; height: 120px; margin: 10px; animation: bounce 0.8s infinite alternate; }
        .win-modal p { font-size: 26px; font-weight: bold; }

        @keyframes bounce { from { transform: translateY(0); } to { transform: translateY(-15px); } }

        .reload-btn {
            margin-top: 15px; background: transparent; color: #fff;
            border: 1px solid rgba(255,255,255,0.5); padding: 5px 15px;
            border-radius: 10px; font-size: 12px; cursor: pointer;
        }
    </style>
</head>
<body>

    <canvas id="coin-canvas"></canvas>

    <div class="top-bar">
        <div class="ui-box">
            <span style="font-size: 24px;">👑</span>
            <div class="ui-text">المستوى 1</div>
        </div>
        <div class="ui-box">
            <img src="coin.png" alt="coin">
            <div class="ui-text" id="ui-coins">500</div>
        </div>
    </div>

    <div class="game-area">
        <div class="machine" id="machine">
            <div class="reels-display">
                <div class="reel"><div class="reel-strip" id="reel1"></div></div>
                <div class="reel"><div class="reel-strip" id="reel2"></div></div>
                <div class="reel"><div class="reel-strip" id="reel3"></div></div>
                <div class="win-line"></div>
            </div>
        </div>

        <div class="controls">
            <div class="spins-box">اللفات: <span id="ui-spins">10</span></div>
            <button class="spin-btn" id="spinBtn">SPIN</button>
            <button class="reload-btn" onclick="location.reload()">إعادة تعبئة اللفات</button>
        </div>
    </div>

    <div class="win-modal" id="winModal">
        <h2 id="winTitle">JACKPOT!</h2>
        <img id="winImg" src="coin.png" alt="Reward">
        <p>ربحت <span id="winAmount">0</span> عملة!</p>
    </div>

    <script>
        // --- الأصوات ---
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        const audioCtx = new AudioContext();
        
        function playSound(type) {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const osc = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();
            osc.connect(gainNode); gainNode.connect(audioCtx.destination);
            
            if (type === 'spin') {
                osc.type = 'square';
                osc.frequency.setValueAtTime(150, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(300, audioCtx.currentTime + 0.1);
                gainNode.gain.setValueAtTime(0.1, audioCtx.currentTime);
                gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
                osc.start(); osc.stop(audioCtx.currentTime + 0.1);
            } else if (type === 'win') {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(400, audioCtx.currentTime);
                osc.frequency.setValueAtTime(600, audioCtx.currentTime + 0.1);
                osc.frequency.setValueAtTime(800, audioCtx.currentTime + 0.2);
                gainNode.gain.setValueAtTime(0.2, audioCtx.currentTime);
                gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.5);
                osc.start(); osc.stop(audioCtx.currentTime + 0.5);
            }
        }

        // --- إعدادات اللعبة ---
        const symbols = ['coin.png', 'diamond.png', 'shield.png'];
        let state = { coins: 500, spins: 10, isSpinning: false };

        const uiCoins = document.getElementById('ui-coins');
        const uiSpins = document.getElementById('ui-spins');
        const spinBtn = document.getElementById('spinBtn');
        const winModal = document.getElementById('winModal');
        const machine = document.getElementById('machine');

        function updateUI() {
            uiCoins.innerText = state.coins;
            uiSpins.innerText = state.spins;
            spinBtn.disabled = state.spins <= 0 || state.isSpinning;
        }

        function populateReels() {
            for (let i = 1; i <= 3; i++) {
                const reel = document.getElementById(`reel${i}`);
                let html = '';
                for (let j = 0; j < 20; j++) {
                    const randSym = symbols[Math.floor(Math.random() * symbols.length)];
                    html += `<img src="${randSym}">`;
                }
                reel.innerHTML = html;
            }
        }

        function spin() {
            if (state.isSpinning || state.spins <= 0) return;

            state.isSpinning = true;
            state.spins--;
            updateUI();
            winModal.classList.remove('show');
            populateReels();
            playSound('spin');

            const imageHeight = 80;

            function animateReel(id, duration, targetIndex) {
                const reel = document.getElementById(id);
                reel.style.transition = 'none';
                reel.style.transform = 'translateY(0px)';
                void reel.offsetWidth;

                const moveDistance = (imageHeight * 15) + (targetIndex * imageHeight);
                reel.style.transition = `transform ${duration}s cubic-bezier(0.1, 0.7, 0.1, 1)`;
                reel.style.transform = `translateY(-${moveDistance}px)`;
            }

            const res1 = Math.floor(Math.random() * 3);
            const res2 = Math.floor(Math.random() * 3);
            const res3 = Math.floor(Math.random() * 3);

            animateReel('reel1', 2.5, res1);
            animateReel('reel2', 3.0, res2);
            animateReel('reel3', 3.5, res3);

            setTimeout(() => {
                state.isSpinning = false;
                updateUI();
                checkWin(res1, res2, res3);
            }, 3800);
        }

        function checkWin(r1, r2, r3) {
            let amount = 0;
            let isJackpot = false;

            if (r1 === r2 && r2 === r3) {
                amount = 500;
                isJackpot = true;
                playSound('win');
                machine.classList.add('shake');
                setTimeout(() => machine.classList.remove('shake'), 500);
                createCoinRain();
                showModal(amount, "JACKPOT! 🎉");
            } else if (r1 === r2 || r2 === r3 || r1 === r3) {
                amount = 50;
                playSound('win');
                showModal(amount, "فوز رائع!");
            } else {
                amount = 10;
                showModal(amount, "حظ أوفر!");
            }
            
            state.coins += amount;
            updateUI();
        }

        function showModal(amount, title) {
            document.getElementById('winTitle').innerText = title;
            document.getElementById('winAmount').innerText = amount;
            winModal.classList.add('show');
            setTimeout(() => winModal.classList.remove('show'), 3000);
        }

        // --- مطر العملات ---
        const canvas = document.getElementById('coin-canvas');
        const ctx = canvas.getContext('2d');
        let particles = [];

        function resizeCanvas() {
            canvas.width = window.innerWidth; canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        function createCoinRain() {
            for (let i = 0; i < 50; i++) {
                particles.push({
                    x: Math.random() * canvas.width, y: -50 - Math.random() * 100,
                    size: 30 + Math.random() * 20, speedY: 3 + Math.random() * 5,
                    speedX: -2 + Math.random() * 4, rotation: Math.random() * Math.PI,
                    rotSpeed: -0.1 + Math.random() * 0.2
                });
            }
        }

        const coinImg = new Image(); coinImg.src = 'coin.png';

        function updateParticles() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            for (let i = particles.length - 1; i >= 0; i--) {
                let p = particles[i];
                p.y += p.speedY; p.x += p.speedX; p.rotation += p.rotSpeed;
                ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.rotation);
                ctx.drawImage(coinImg, -p.size/2, -p.size/2, p.size, p.size); ctx.restore();
                if (p.y > canvas.height + 50) particles.splice(i, 1);
            }
            requestAnimationFrame(updateParticles);
        }
        updateParticles();

        populateReels();
        updateUI();
        spinBtn.addEventListener('click', spin);
    </script>
</body>
</html>
